[package]
authors = ["Sergey V. Galtsev <sergey-v-galtsev@gitlab.com>"]
description = "Nikka is an educational operating system"
edition = "2024"
homepage = "https://sergey-v-galtsev.gitlab.io/labs-description/lab/book/index.html"
license = "AGPL-3.0-or-later"
name = "nikka"
repository = "https://gitlab.com/sergey-v-galtsev/nikka-public"
version = "0.5.0"

[build-dependencies]
anyhow = "1.0"
bootloader = { version = "0.11", default-features = false, features = ["uefi"] }

[dependencies]
anyhow = "1.0"
ovmf-prebuilt = "*"
strip-ansi-escapes = "*"
structopt = "*"
tokio = { version = "*", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none", features = ["tests"] }

[features]
tests = ["kernel/tests"]

[workspace]
members = [
    "kernel",
    "ku",
    "pci",
    "pic8259",
    "sentinel_frame",
    "serial",
    "text",

    "user/cow_fork",
    "user/eager_fork",
    "user/exit",
    "user/lib",
    "user/log_value",
    "user/loop",
    "user/check_context",
    "user/memory_syscalls",
    "user/page_fault",
    "user/sched_yield",
    "user/trap_handler",

    "kernel/examples/bga",
]

resolver = "2"

[profile.user]
inherits = "dev"

[profile.ci]
debug = true
debug-assertions = true
incremental = true
inherits = "dev"
opt-level = 3
overflow-checks = true

[profile.benchmark]
debug = false
debug-assertions = false
incremental = true
inherits = "release"
opt-level = 3
overflow-checks = false

#[profile.release]
#lto = "off"
#panic = "abort"
#incremental = false

#[profile.dev.package."bootloader"] # https://old.reddit.com/r/rust/comments/gvrgca/this_is_a_neat_trick_for_getting_good_runtime/
#opt-level = 1
