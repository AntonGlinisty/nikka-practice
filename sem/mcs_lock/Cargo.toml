[package]
authors = ["Oleg Shatov <oleq.shatov@yandex.ru>"]
edition = "2024"
license = "AGPL-3.0-or-later"
name = "mcs_lock"
version = "0.5.0"

[dependencies]
crossbeam = { version = "0.8" }

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.6" }
rand = { version = "*" }
rstest = { version = "0.25" }
rustix = { version = "0.38", features = ["process"] }
spin = { version = "0.9", features = ["mutex", "spin_mutex", "ticket_mutex"] }

[[bench]]
harness = false
name = "bench"

[[example]]
name = "workload"
