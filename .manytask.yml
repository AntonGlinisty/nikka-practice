      tasks:
        - task: rtc
          is_bonus: true
          score: 100
          url: https://sergey-v-galtsev.gitlab.io/labs-description/lab/book/1-hw-1-rtc.html
          check:
            - cd kernel && cargo test --profile ci --test 1-hw-1-rtc
            - cd kernel && cargo test --profile ci --test 1-hw-1-rtc -- -rtc base=2050-12-31T23:59:53
            - cd kernel && cargo test --profile ci --test 1-hw-1-rtc -- -rtc base=2050-01-01T11:59:53

        - task: once-lock
          is_bonus: true
          score: 50
          url: https://sergey-v-galtsev.gitlab.io/labs-description/lab/book/5-sync-1-once-lock.html
          check:
            - cd ku && cargo test --profile ci --test 5-sync-1-once-lock -- --test-threads=1
            - cd ku && cargo clean
            - cd ku && MIRIFLAGS="-Zmiri-disable-isolation" cargo miri test --test 5-sync-1-once-lock

        - task: spinlock
