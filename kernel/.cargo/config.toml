[build]
rustflags = [
    "--codegen",
    "force-frame-pointers=yes",
    "--codegen",
    "relocation-model=dynamic-no-pic",
    "--codegen",
    "debuginfo=full",
]
target = "x86_64-unknown-none"

[target.'cfg(target_os = "none")']
runner = ["bash", "-c", "echo 'Run the kernel from the upper directory.'"]

[unstable]
build-std = ["alloc", "compiler_builtins", "core"]
