grade:
  image: registry.gitlab-standby.manytask.org/os/public-2026-2027/nikka-public
  script:
    - if [[ "$CI_COMMIT_REF_NAME" == submit/* ]]; then
        cargo run
          --manifest-path /opt/shad/nikka/tools/check/Cargo.toml
          --
          --student-repo $CI_PROJECT_DIR
          --original-repo /opt/shad/nikka
          --ci-branch-name $CI_COMMIT_REF_NAME
          --user-id $GITLAB_USER_ID;
      else
        cat .wrong-submit-message >&2;
        exit 1;
      fi
  timeout: 30 minutes
